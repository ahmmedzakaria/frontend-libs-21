<div class="image-preview">
  <button
    type="button"
    class="thumb-btn focus-ring"
    [class.circle]="shape() === 'circle'"
    [disabled]="disabled()"
    (click)="openViewer()"
    [attr.aria-label]="title()"
  >
    <img
      [src]="currentSrc()"
      [alt]="alt()"
      class="thumb"
      [class.circle]="shape() === 'circle'"
      [attr.width]="width()"
      [attr.height]="height()"
      (error)="onImageError()"
    />
  </button>

  @if (previewOnClick() && hint()) {
    <div class="hint">{{ hint() }}</div>
  }

  @if (viewerOpen()) {
    <div
      class="viewer-backdrop"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
      (click)="closeViewer()"
      (keydown)="onViewerKeydown($event)"
    >
      <div class="viewer-card" (click)="$event.stopPropagation()">
        <div class="viewer-header">
          <div>
            <div class="viewer-title">{{ title() }}</div>
            @if (subtitle()) {
              <div class="viewer-subtitle">{{ subtitle() }}</div>
            }
          </div>
          <button type="button" class="close-btn focus-ring" (click)="closeViewer()">
            <app-icon name="times" [size]="14" /> Close
          </button>
        </div>
        <div class="viewer-body">
          <img [src]="currentSrc()" [alt]="alt()" class="viewer-image" (error)="onImageError()" />
        </div>
      </div>
    </div>
  }
</div>
