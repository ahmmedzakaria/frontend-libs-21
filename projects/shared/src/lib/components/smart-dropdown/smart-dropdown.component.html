@switch (mode()) {
  @case ('static') {
    <app-static-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [options]="options()"
      [label]="label()"
      [placeholder]="placeholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [errorMessage]="errorMessage()"
      [compareWith]="compareWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
  @case ('api-simple') {
    <app-api-simple-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [loadOptions]="loadOptions()"
      [label]="label()"
      [placeholder]="placeholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [debounceMs]="debounceMs()"
      [errorMessage]="errorMessage()"
      [compareWith]="compareWith()"
      [initialOption]="initialOption()"
      [displayWith]="displayWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
  @default {
    <app-api-scroll-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [loadOptions]="loadOptions()"
      [label]="label()"
      [placeholder]="placeholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [debounceMs]="debounceMs()"
      [errorMessage]="errorMessage()"
      [compareWith]="compareWith()"
      [initialOption]="initialOption()"
      [displayWith]="displayWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
}
