<div class="pagination" role="navigation" aria-label="Pagination">
  <div class="range">
    @if (total() > 0) {
      Showing <b>{{ rangeStart() }}–{{ rangeEnd() }}</b> of <b>{{ total() }}</b>
    } @else {
      No records
    }
  </div>
  <div class="controls">
    <button type="button" class="page-btn" aria-label="First page" [disabled]="!canPrev()" (click)="first()">
      <app-icon name="chevrons-left" [size]="15" />
    </button>
    <button type="button" class="page-btn" aria-label="Previous page" [disabled]="!canPrev()" (click)="prev()">
      <app-icon name="chevron-left" [size]="15" />
    </button>
    <span class="page-label">Page {{ page() }} of {{ totalPages() }}</span>
    <button type="button" class="page-btn" aria-label="Next page" [disabled]="!canNext()" (click)="next()">
      <app-icon name="chevron-right" [size]="15" />
    </button>
    <button type="button" class="page-btn" aria-label="Last page" [disabled]="!canNext()" (click)="last()">
      <app-icon name="chevrons-right" [size]="15" />
    </button>
  </div>
</div>
