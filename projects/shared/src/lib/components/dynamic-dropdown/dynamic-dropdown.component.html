@switch (resolvedMode()) {
  @case ('static') {
    <app-static-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [options]="resolvedOptions()"
      [label]="label()"
      [placeholder]="resolvedPlaceholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [errorMessage]="errorMessage()"
      [compareWith]="resolvedCompareWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
  @case ('api-simple') {
    <app-api-simple-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [loadOptions]="resolvedLoadOptions()"
      [label]="label()"
      [placeholder]="resolvedPlaceholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [debounceMs]="debounceMs()"
      [errorMessage]="errorMessage()"
      [compareWith]="resolvedCompareWith()"
      [initialOption]="initialOption()"
      [displayWith]="resolvedDisplayWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
  @default {
    <app-api-scroll-dropdown
      [value]="value()"
      [disabled]="disabled()"
      [loadOptions]="resolvedLoadOptions()"
      [label]="label()"
      [placeholder]="resolvedPlaceholder()"
      [searchable]="searchable()"
      [searchPlaceholder]="searchPlaceholder()"
      [debounceMs]="debounceMs()"
      [errorMessage]="errorMessage()"
      [compareWith]="resolvedCompareWith()"
      [initialOption]="initialOption()"
      [displayWith]="resolvedDisplayWith()"
      (valueChange)="emitValue($event)"
      (touched)="markTouched()"
    />
  }
}
