<div class="dropdown-field">
  @if (label()) {
    <span class="lbl">{{ label() }}</span>
  }

  <button
    type="button"
    class="trigger focus-ring"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    role="combobox"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [attr.aria-controls]="uid + '-listbox'"
    [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
    [disabled]="disabled()"
    [class.invalid]="!!errorMessage()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="value" [class.placeholder]="!selectedOption()">
      @if (selectedOption()?.icon) {
        <app-icon [name]="selectedOption()!.icon!" [size]="14" />
      }
      {{ selectedOption()?.label ?? placeholder() }}
    </span>
    <app-icon name="chevron-down" [size]="13" class="chev" [class.open]="open()" />
  </button>

  @if (errorMessage()) {
    <span class="error">{{ errorMessage() }}</span>
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="[
    { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 4 },
    { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -4 }
  ]"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="dropdown-panel" role="listbox" [id]="uid + '-listbox'">
    @for (option of options(); track option.label; let i = $index) {
      <div
        class="option"
        role="option"
        [id]="optionId(i)"
        [attr.aria-selected]="selectedOption() === option"
        [attr.aria-disabled]="option.disabled || null"
        [class.active]="activeIndex() === i"
        [class.selected]="selectedOption() === option"
        [class.disabled]="option.disabled"
        (mouseenter)="activeIndex.set(i)"
        (click)="selectOption(option)"
      >
        <span class="opt-content">
          @if (option.icon) {
            <app-icon [name]="option.icon" [size]="14" />
          }
          <span>{{ option.label }}</span>
        </span>
        @if (selectedOption() === option) {
          <app-icon name="check" [size]="14" />
        }
      </div>
    } @empty {
      <div class="option disabled">No options</div>
    }
  </div>
</ng-template>
