<div class="field">
  @if (label()) {
    <span class="lbl">{{ label() }}</span>
  }

  <div
    class="grid"
    [class.responsive]="responsive()"
    [style.gridTemplateColumns]="'repeat(' + columns() + ', minmax(11.25rem, 1fr))'"
    role="radiogroup"
    [attr.aria-label]="label() || null"
    (keydown)="onKeydown($event)"
  >
    @for (option of options(); track option.label; let i = $index) {
      <div
        class="card"
        [class.selected]="isSelected(option)"
        [class.focused]="i === focusedIndex()"
        [class.disabled]="option.disabled || disabled()"
        tabindex="0"
        role="radio"
        [attr.aria-checked]="isSelected(option)"
        [attr.aria-disabled]="option.disabled || disabled() || null"
        (click)="select(option)"
      >
        @if (option.icon) {
          <app-icon [name]="option.icon" [size]="22" class="card-icon" />
        }
        <div class="card-content">
          <div class="card-label">{{ option.label }}</div>
          @if (option.description) {
            <small class="card-description">{{ option.description }}</small>
          }
        </div>
        @if (option.badge) {
          <span class="badge">{{ option.badge }}</span>
        }
      </div>
    }
  </div>
</div>
