@switch (mode()) {
  @case ('profile-photo') {
    <app-profile-photo-upload
      [formControl]="innerControl"
      [label]="resolvedLabel()"
      [accept]="resolvedAccept()"
      [maxSizeMB]="resolvedMaxSizeMB()"
      [existingPreviewUrl]="resolvedAttachmentConfig()?.url ?? ''"
      [existingPreviewTitle]="resolvedAttachmentConfig()?.title ?? 'Current Photo'"
    />
  }
  @default {
    <app-file-upload
      [formControl]="innerControl"
      [label]="resolvedLabel()"
      [hint]="hint()"
      [accept]="resolvedAccept()"
      [multiple]="multiple()"
      [maxSizeMB]="resolvedMaxSizeMB()"
      [uploadUrl]="uploadUrl()"
      [showPreview]="showPreview()"
      [existingPreviewUrl]="resolvedAttachmentConfig()?.url ?? ''"
      [existingPreviewTitle]="resolvedAttachmentConfig()?.title ?? 'Current Photo'"
      (filesSelected)="filesSelected.emit($event)"
      (uploadComplete)="uploadComplete.emit($event)"
    />
  }
}
