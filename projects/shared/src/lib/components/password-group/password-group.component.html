<div class="password-group">
  <div class="field" (focusin)="toggleHints(true)" (focusout)="toggleHints(false)">
    @if (label()) {
      <label class="lbl" [for]="uid + '-pw'">{{ label() }}</label>
    }
    <div class="control-frame" [class.invalid]="touched() && required() && !value()" [class.disabled]="disabled()">
      <app-icon name="lock" [size]="15" class="prefix" />
      <input
        [id]="uid + '-pw'"
        [type]="passwordVisible() ? 'text' : 'password'"
        [value]="value() ?? ''"
        [disabled]="disabled()"
        (input)="onPasswordInput($event)"
        (blur)="onBlur()"
      />
      <button
        type="button"
        class="toggle focus-ring"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()"
      >
        <app-icon [name]="passwordVisible() ? 'eye-slash' : 'eye'" [size]="15" />
      </button>
    </div>

    @if (showStrength() && value()) {
      <div class="password-strength">
        <div class="bar">
          <div class="fill" [class.weak]="score() <= 2" [class.medium]="score() === 3 || score() === 4" [class.strong]="score() === 5" [style.width.%]="strengthPercent()"></div>
        </div>
        <small class="label" [class.weak]="score() <= 2" [class.medium]="score() === 3 || score() === 4" [class.strong]="score() === 5">
          {{ strengthLabel() }} password
        </small>

        @if (showHints() && missingHints().length > 0) {
          <div class="hints">
            @for (hint of missingHints(); track hint) {
              <small class="hint"><app-icon name="circle-info" [size]="12" /> {{ hint }}</small>
            }
          </div>
        }
      </div>
    }
  </div>

  <div class="field">
    @if (confirmLabel()) {
      <label class="lbl" [for]="uid + '-confirm'">{{ confirmLabel() }}</label>
    }
    <div class="control-frame" [class.invalid]="touched() && mismatch()" [class.disabled]="disabled()">
      <app-icon name="lock" [size]="15" class="prefix" />
      <input
        [id]="uid + '-confirm'"
        [type]="confirmVisible() ? 'text' : 'password'"
        [value]="confirmValue()"
        [disabled]="disabled()"
        (input)="onConfirmInput($event)"
        (blur)="onBlur()"
      />
      <button
        type="button"
        class="toggle focus-ring"
        [attr.aria-label]="confirmVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="confirmVisible()"
        (click)="toggleConfirmVisibility()"
      >
        <app-icon [name]="confirmVisible() ? 'eye-slash' : 'eye'" [size]="15" />
      </button>
    </div>
    @if (touched() && mismatch()) {
      <span class="error">Passwords do not match.</span>
    }
  </div>
</div>
