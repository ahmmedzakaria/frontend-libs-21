<div [class.wizard-card]="title()">
  @if (title(); as t) {
    <h4 class="wizard-title">{{ t }}</h4>
  }
  <app-wizard
    [nextLabel]="nextLabel()"
    [previousLabel]="previousLabel()"
    [finishLabel]="finishLabel()"
    [showBackButton]="showBackButton()"
    [backButtonLabel]="backButtonLabel()"
    [showResetButton]="showResetButton()"
    [resetButtonLabel]="resetButtonLabel()"
    (stepIndexChange)="onStepIndexChange($event)"
    (finished)="onFinished()"
    (backClicked)="back.emit()"
    (resetClicked)="onReset()"
  >
    @for (step of resolvedSteps(); track step.key; let i = $index) {
      <app-wizard-step [label]="step.label" [disabled]="!!step.disabled" [form]="stepForms()[i]">
        @if (isReviewStep(step)) {
          <app-dynamic-preview
            [sections]="step.reviewSections ?? []"
            [data]="mergedValuesUpTo(i)"
            [heading]="step.reviewHeading ?? ''"
            [subheading]="step.reviewSubheading ?? ''"
          />
        } @else {
          <app-dynamic-form
            [fields]="step.fields"
            [initialValue]="step.initialValue ?? {}"
            [columns]="step.columns ?? 1"
            (formReady)="setStepForm(i, $event)"
          />
        }
      </app-wizard-step>
    }
  </app-wizard>
</div>
