<button
  type="button"
  [class]="classes()"
  [class.loading]="loading()"
  [disabled]="disabled() || loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <app-icon name="spinner" [size]="14" class="spin" />
  } @else if (icon()) {
    <app-icon [name]="icon()!" [size]="14" />
  }
  @if (label()) {
    <span class="lbl">{{ label() }}</span>
  }
</button>
