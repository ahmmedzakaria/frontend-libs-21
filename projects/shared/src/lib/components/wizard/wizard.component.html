<div class="wizard">
  <app-stepper [steps]="stepDefs()" [activeIndex]="currentIndex()" [linear]="true" (stepChange)="onStepperRequest($event)" />

  <div class="wizard-body">
    <ng-content></ng-content>
  </div>

  <div class="wizard-actions">
    <div class="wizard-actions-group">
      @if (showBackButton()) {
        <app-button variant="ghost" [label]="backButtonLabel()" (clicked)="backClicked.emit()" />
      }
      @if (showResetButton()) {
        <app-button variant="ghost" [label]="resetButtonLabel()" (clicked)="resetClicked.emit()" />
      }
    </div>
    <div class="wizard-actions-group">
      <app-button variant="ghost" [label]="previousLabel()" [disabled]="currentIndex() === 0" (clicked)="back()" />
      <app-button [label]="isLastStep() ? finishLabel() : nextLabel()" [disabled]="currentInvalid()" (clicked)="next()" />
    </div>
  </div>
</div>
