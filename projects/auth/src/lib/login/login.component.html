<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <app-icon name="user-shield" [size]="40" class="header-icon" />
            <h2 class="login-title">Login</h2>
            <p class="login-subtitle">Enter your credentials to continue</p>
        </div>

        <div *ngIf="loadingConfig" class="loading-row">
            <app-icon name="spinner" [size]="16" class="spin" />
            Loading...
        </div>

        <div *ngIf="!loadingConfig && ssoLoginEnabled" class="sso-row">
            <button type="button" class="btn btn-primary btn-block" (click)="loginWithSso()" [disabled]="ssoLoading">
                <app-icon name="right-to-bracket" [size]="14" />
                {{ ssoLoading ? 'Redirecting...' : 'Login with SSO' }}
            </button>
        </div>

        <form *ngIf="!loadingConfig && passwordLoginEnabled" [formGroup]="form" (ngSubmit)="login()">
            <div class="field">
                <label for="username" class="field-label">Username</label>
                <input
                        id="username"
                        type="text"
                        class="native-input"
                        formControlName="username"
                        placeholder="Enter username" />
                <div class="field-error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
                    Username is required
                </div>
            </div>

            <div class="field">
                <label for="password" class="field-label">Password</label>
                <input
                        id="password"
                        type="password"
                        class="native-input"
                        formControlName="password"
                        placeholder="Enter password" />
                <div class="field-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                    Password is required
                </div>
            </div>

            <div class="submit-row">
                <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid">
                    <app-icon name="right-to-bracket" [size]="14" /> Login
                </button>
            </div>
        </form>

        <div *ngIf="!loadingConfig && !passwordLoginEnabled && !ssoLoginEnabled" class="alert alert-warning">
            No login method is enabled.
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>
    </div>
</div>
