@if (layoutConfig.topbarEnabled()) {
  <app-header />
}

<div class="app-body">
  @if (layoutConfig.sidebarEnabled()) {
    @if (rail.mobileOpen()) {
      <div class="rail-backdrop" (click)="rail.closeMobile()"></div>
    }
    <app-rail-nav />
  }
  <main class="main">
    @if (layoutConfig.breadcrumbEnabled()) {
      <app-breadcrumb />
    }
    <router-outlet />
  </main>
</div>

@if (layoutConfig.footerEnabled()) {
  <app-status-bar />
}
